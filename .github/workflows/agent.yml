name: Build Agent

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # gofmt + vet + race-enabled tests gate the cross-compiled release
  # binaries. These were previously only ever run by hand.
  verify:
    name: gofmt, vet & tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify Actions are SHA-pinned
        run: bash .github/scripts/check-actions-pinned.sh

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.mod

      - name: gofmt
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::These files are not gofmt-clean:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

  build:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64 }
          - { goarch: arm64 }
          - { goarch: arm }
          - { goarch: "386" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24'

      - name: Build
        working-directory: agent
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o didban-agent .
          tar czf "didban-agent-linux-${{ matrix.goarch }}.tar.gz" didban-agent
          sha256sum "didban-agent-linux-${{ matrix.goarch }}.tar.gz" > "didban-agent-linux-${{ matrix.goarch }}.tar.gz.sha256"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: didban-agent-linux-${{ matrix.goarch }}
          path: |
            agent/didban-agent-linux-*.tar.gz
            agent/*.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate-release-notes: true
          files: dist/*
