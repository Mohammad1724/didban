name: Build Agent

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goarch: amd64 }
          - { goarch: arm64 }
          - { goarch: arm }
          - { goarch: "386" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        working-directory: agent
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o didban-agent .
          tar czf "didban-agent-linux-${{ matrix.goarch }}.tar.gz" didban-agent
          sha256sum "didban-agent-linux-${{ matrix.goarch }}.tar.gz" > "didban-agent-linux-${{ matrix.goarch }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: didban-agent-linux-${{ matrix.goarch }}
          path: |
            agent/didban-agent-linux-*.tar.gz
            agent/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate-release-notes: true
          files: dist/*
