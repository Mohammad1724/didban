name: Build Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # Unit tests + lint gate the release build: until this job existed, a tag
  # could publish an APK that did not even pass its own test suite.
  verify:
    name: Tests & lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify Actions are SHA-pinned
        run: |
          BAD="$(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+@[^[:space:]#]+' .github/workflows | sed -E 's/.*@//' | grep -Ev '^[0-9a-f]{40}$' || true)"
          if [ -n "$BAD" ]; then
            echo "::error::Every GitHub Action must be pinned to a full commit SHA."
            printf '%s\n' "$BAD"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Lint
        run: gradle lintDebug --no-daemon

      - name: Verify Android component exposure policy
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          manifest = ET.parse('app/src/main/AndroidManifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          app = manifest.find('application')
          assert app is not None
          assert app.get(android + 'allowBackup') == 'false'
          assert app.get(android + 'usesCleartextTraffic') == 'false'
          allowed_exported = {'.MainActivity'}
          for tag in ('activity', 'activity-alias', 'service', 'receiver', 'provider'):
              for component in app.findall(tag):
                  name = component.get(android + 'name', '')
                  exported = component.get(android + 'exported') == 'true'
                  if exported and name not in allowed_exported:
                      raise SystemExit(f'Unexpected exported Android component: {tag} {name}')
          receiver = app.find("receiver[@{http://schemas.android.com/apk/res/android}name='.DidbanWidgetProvider']")
          assert receiver is not None and receiver.get(android + 'exported') == 'false'
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/redesign/**
          if-no-files-found: ignore

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.7'

      - name: Prepare signing (uses repo secrets when available)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSPASS" ]; then
            umask 077
            printf '%s' "$KS" | base64 -d > "$HOME/didban-release.keystore"
            chmod 600 "$HOME/didban-release.keystore"
            echo "DIDBAN_STORE_FILE=$HOME/didban-release.keystore" >> "$GITHUB_ENV"
            echo "DIDBAN_STORE_PASSWORD=$KSPASS" >> "$GITHUB_ENV"
            echo "DIDBAN_KEY_ALIAS=didban" >> "$GITHUB_ENV"
            echo "DIDBAN_KEY_PASSWORD=$KSPASS" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Release tags require ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
            exit 1
          else
            echo "Signing secrets not configured — branch build uses the debug key and is not a trusted release."
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify release hardening and APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          MAPPING=app/build/outputs/mapping/release/mapping.txt
          test -s "$APK"
          test -s "$MAPPING" || { echo "::error::R8 mapping is missing; release minification did not run."; exit 1; }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Collect APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            NAME="Didban-$VERSION.apk"
          else
            NAME="Didban-$VERSION-debug-key-UNTRUSTED.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" > "$NAME.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: didban-apk
          path: |
            Didban-*.apk
            Didban-*.apk.sha256
          retention-days: 14
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate-release-notes: true
          files: dist/*
