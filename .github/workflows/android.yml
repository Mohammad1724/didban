name: Build Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Unit tests + lint gate the release build: until this job existed, a tag
  # could publish an APK that did not even pass its own test suite.
  verify:
    name: Tests & lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Lint
        run: gradle lintDebug --no-daemon

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: ignore

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing (uses repo secrets when available)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSPASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KSPASS" ]; then
            printf '%s' "$KS" | base64 -d > "$HOME/didban-release.keystore"
            echo "DIDBAN_STORE_FILE=$HOME/didban-release.keystore" >> "$GITHUB_ENV"
            echo "DIDBAN_STORE_PASSWORD=$KSPASS" >> "$GITHUB_ENV"
            echo "DIDBAN_KEY_ALIAS=didban" >> "$GITHUB_ENV"
            echo "DIDBAN_KEY_PASSWORD=$KSPASS" >> "$GITHUB_ENV"
          else
            echo "Signing secrets not configured — building a debug-signed (still installable) APK."
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Collect APK
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          VERSION="${VERSION//\//-}"
          cp app/build/outputs/apk/release/app-release.apk "Didban-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: didban-apk
          path: Didban-*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          generate-release-notes: true
          files: dist/*
