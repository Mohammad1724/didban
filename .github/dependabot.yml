version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security

  - package-ecosystem: gomod
    directory: /agent
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - security
