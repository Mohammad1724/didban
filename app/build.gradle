plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def storeFilePath = project.findProperty('DIDBAN_STORE_FILE') ?: System.getenv('DIDBAN_STORE_FILE')
def storePassVal  = project.findProperty('DIDBAN_STORE_PASSWORD') ?: System.getenv('DIDBAN_STORE_PASSWORD')
def keyAliasVal   = project.findProperty('DIDBAN_KEY_ALIAS') ?: System.getenv('DIDBAN_KEY_ALIAS')
def keyPassVal    = project.findProperty('DIDBAN_KEY_PASSWORD') ?: System.getenv('DIDBAN_KEY_PASSWORD')
def hasSigning = storeFilePath != null && new File(storeFilePath).exists()

android {
    namespace 'org.didban.monitor'
    compileSdk 34

    defaultConfig {
        applicationId "org.didban.monitor"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "0.7.0"
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(storeFilePath)
                storePassword storePassVal
                keyAlias keyAliasVal
                keyPassword keyPassVal
            }
        }
    }

    buildTypes {
        release {
            // Release artifacts are optimized and stripped. Security-critical
            // crypto/SSH implementations loaded by class name are retained by
            // the narrow rules in proguard-rules.pro.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasSigning ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            "-opt-in=androidx.compose.foundation.ExperimentalFoundationApi",
            "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"
        ]
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = "384m"
            jvmArgs "-XX:MaxMetaspaceSize=192m", "-XX:+UseSerialGC"
            systemProperty "robolectric.dependency.repo.url", "https://repo.maven.apache.org/maven2"
        }
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/INDEX.LIST',
                '/META-INF/DEPENDENCIES'
            ]
            pickFirsts += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/versions/**',
                'META-INF/OSGI-INF/**'
            ]
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'org.json:json:20240303'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.mwiede:jsch:0.2.18'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
}
